  <meta name="theme-color" content="#060606"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>Premier Multimarcas</title>
  <link rel="manifest" href="manifest.json"/>
  <script>
    (() => {
      try {
        const params = new URLSearchParams(window.location.search);
        if (params.get("catalogo") !== "1") return;
        const target = new URL("catalogo.html", window.location.href);
        ["colaborador", "vendedor", "consultor"].forEach(key => {
          const value = params.get(key);
          if (value) target.searchParams.set(key, value);
        });
        target.hash = "";
        window.location.replace(target.toString());
      } catch (e) {}
    })();
  </script>

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    body{margin:0;background:#060606;color:#F0F0F0;font-family:system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
    ::-webkit-scrollbar{width:4px;height:4px}

    @keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

function activityTimeValue(v) {
  const s = String(v || "");
  const m = s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})(?:,\s*)?(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if (m) return new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]), Number(m[4]) || 0, Number(m[5]) || 0, Number(m[6]) || 0).getTime();
  const t = new Date(s).getTime();
  return Number.isNaN(t) ? 0 : t;
}
